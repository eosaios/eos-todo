name: build

# EOS Todo 闭源商业软件：源码在私有仓 eosaios/eos-todolist，本公开仓承载
# 多平台构建与问题反馈，beta 期间安装包直接发本仓 Releases（与 EOS Media
# 同模式）。私有仓访问：EOS_TODOLIST_DEPLOY_KEY（只读 deploy key）。
# workflow_dispatch 构建只出 artifacts 供内部验证，不建 Release；
# 推 v* tag 触发的构建完成后自动创建带 SHA256SUMS 的公开 Release。

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      ref:
        description: 'Branch or tag of eosaios/eos-todolist to build'
        required: true
        default: 'main'

permissions:
  contents: write

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: ${{ matrix.platform }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            platform: windows
          - os: macos-latest
            platform: darwin
          - os: ubuntu-24.04
            platform: linux
    runs-on: ${{ matrix.os }}
    steps:
      - name: Set up SSH for private source checkout
        uses: webfactory/ssh-agent@v0.9.1
        with:
          ssh-private-key: ${{ secrets.EOS_TODOLIST_DEPLOY_KEY }}

      - name: Determine source ref
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "REF=${{ inputs.ref }}" >> "$GITHUB_ENV"
          else
            echo "REF=${GITHUB_REF_NAME}" >> "$GITHUB_ENV"
          fi

      - name: Clone private source
        run: git clone --depth 1 --branch "$env:REF" git@github.com:eosaios/eos-todolist.git app
        if: runner.os == 'Windows'
      - name: Clone private source
        run: git clone --depth 1 --branch "$REF" git@github.com:eosaios/eos-todolist.git app
        if: runner.os != 'Windows'

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.25'
          cache-dependency-path: app/go.sum

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Linux build deps
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libgtk-4-dev libwebkitgtk-6.0-dev libx11-dev libx11-xcb-dev libxtst-dev libxkbcommon-dev libxkbcommon-x11-dev

      - name: Install NSIS (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          choco install nsis -y --no-progress
          Add-Content $env:GITHUB_PATH "C:\Program Files (x86)\NSIS"

      - name: Install wails3 CLI
        run: go install github.com/wailsapp/wails/v3/cmd/wails3@v3.0.0-beta.17

      - name: Stamp version from tag
        if: startsWith(env.REF, 'v')
        working-directory: app
        shell: bash
        run: |
          VER="${REF#v}"
          # NSIS/PE 版本资源必须是 X.X.X.X 纯数字：beta.N 归入第四段，无后缀则 .0
          BASE="$(echo "$VER" | sed -E 's/^([0-9]+\.[0-9]+\.[0-9]+).*/\1/')"
          BETA="$(echo "$VER" | sed -En 's/.*beta\.([0-9]+).*/\1/p')"
          [ -n "$BETA" ] || BETA=0
          NSISVER="$BASE.$BETA"
          echo "app version: $VER, windows resource version: $NSISVER"
          # sed -i.bak 兼容 GNU/BSD（macOS bare -i 会把脚本当后缀参数）
          sed -i.bak -E "s/^(  version: )\".*\"/\1\"$VER\"/" build/config.yml && rm -f build/config.yml.bak
          wails3 task common:update:build-assets
          # update:build-assets 会把带后缀的版本写进 Windows 版本资源，换回四段数字
          sed -i.bak -E "s/\"file_version\": \"[^\"]*\"/\"file_version\": \"$NSISVER\"/" build/windows/info.json && rm -f build/windows/info.json.bak
          sed -i.bak -E "s/\"ProductVersion\": \"[^\"]*\"/\"ProductVersion\": \"$NSISVER\"/" build/windows/info.json && rm -f build/windows/info.json.bak
          # NSIS 的版本硬编码在生成的 wails_tools.nsh（INFO_PRODUCTVERSION）
          sed -i.bak -E "s/^([[:space:]]*!define INFO_PRODUCTVERSION )\"[^\"]*\"/\1\"$NSISVER\"/" build/windows/nsis/wails_tools.nsh && rm -f build/windows/nsis/wails_tools.nsh.bak
          grep -E 'version|Version' build/config.yml build/windows/info.json | head -5
          grep 'INFO_PRODUCTVERSION ' build/windows/nsis/wails_tools.nsh

      - name: Build frontend
        working-directory: app/frontend
        run: |
          npm ci
          npm run build

      - name: Package (Windows installer)
        if: runner.os == 'Windows'
        working-directory: app
        run: wails3 task windows:package

      - name: Package (macOS universal dmg)
        if: runner.os == 'macOS'
        working-directory: app
        run: |
          wails3 task darwin:package:universal
          wails3 task darwin:create:dmg

      - name: Package (Linux AppImage + deb)
        if: runner.os == 'Linux'
        working-directory: app
        run: |
          wails3 task linux:package
          wails3 task linux:generate:deb

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: eos-todo-${{ matrix.platform }}-${{ env.REF }}
          path: |
            app/bin/*-installer.exe
            app/bin/*.dmg
            app/bin/*.AppImage
            app/bin/*.deb
          retention-days: 90
          if-no-files-found: error

  release:
    name: Create GitHub Release
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    needs: build
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          pattern: eos-todo-*
          merge-multiple: true

      - name: Generate SHA256SUMS
        run: |
          cd dist
          sha256sum * > SHA256SUMS.txt
          cat SHA256SUMS.txt

      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION="${GITHUB_REF_NAME}"
          gh release create "$VERSION" dist/* \
            --title "EOS Todo $VERSION" \
            --notes "三端安装包（Windows NSIS 安装器 / macOS dmg universal / Linux deb+AppImage），beta 期间免费使用。

          - Windows：NSIS 安装器
          - macOS：universal dmg（Intel + Apple Silicon），未签名，首次打开如被 Gatekeeper 拦截请执行 \`xattr -cr /Applications/EOS\\ Todo.app\`
          - Linux：deb 与 AppImage
          - 数据存于用户目录，升级安装不影响已有待办
          - 完整性校验见 SHA256SUMS.txt" \
            --repo "$GITHUB_REPOSITORY" 2>/dev/null \
          || gh release upload "$VERSION" dist/* --clobber --repo "$GITHUB_REPOSITORY"
